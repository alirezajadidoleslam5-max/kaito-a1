
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kaito_a1 | System Access</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --green: #00ff9c;
    --blue: #1685ff;
    --bg: #020605;
}

body {
    background: var(--bg);
    color: var(--green);
    font-family: Consolas, monospace;
    min-height: 100vh;
    overflow: hidden;
}

/* Background video */
.bg-video {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: 0;
    filter: brightness(.42) contrast(1.1);
}

/* Overlay */
.overlay {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .33);
    z-index: 1;
}

/* Scanlines */
.scanlines {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 4;
    background: repeating-linear-gradient(
        transparent 0px,
        rgba(0,255,156,.035) 1px,
        transparent 3px,
        transparent 5px
    );
}

.container {
    position: relative;
    z-index: 2;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    text-align: center;
    padding: 20px;
}

.status {
    position: absolute;
    z-index: 3;
    top: 25px;
    left: 25px;
    font-size: 12px;
    line-height: 2;
}

.dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    background: var(--green);
    border-radius: 50%;
    box-shadow: 0 0 10px var(--green);
    animation: blink 1s infinite;
}

.logo {
    width: 145px;
    max-height: 145px;
    object-fit: contain;
    filter: drop-shadow(0 0 18px var(--blue));
    margin-bottom: 25px;
}

h1 {
    color: white;
    font-size: clamp(38px, 8vw, 78px);
    letter-spacing: 5px;
    text-shadow: 0 0 18px var(--blue);
    animation: glitch 3s infinite;
}

.terminal {
    margin-top: 30px;
    width: min(440px, 90vw);
    border: 1px solid rgba(0,255,156,.5);
    background: rgba(0,10,7,.76);
    backdrop-filter: blur(5px);
    padding: 18px;
    text-align: left;
    box-shadow: 0 0 25px rgba(0,255,156,.1);
    font-size: 12px;
    line-height: 2;
}

.terminal-title {
    color: white;
    border-bottom: 1px solid #18553e;
    padding-bottom: 8px;
    margin-bottom: 10px;
}

.green { color: var(--green); }
.blue { color: var(--blue); }

.cursor {
    display: inline-block;
    width: 8px;
    height: 15px;
    background: var(--green);
    vertical-align: middle;
    animation: blink .8s infinite;
}

.controls {
    margin-top: 25px;
}

button {
    background: rgba(0,0,0,.5);
    border: 1px solid var(--green);
    color: var(--green);
    padding: 12px 22px;
    font-family: Consolas, monospace;
    cursor: pointer;
    letter-spacing: 2px;
    transition: .3s;
}

button:hover {
    background: var(--green);
    color: black;
    box-shadow: 0 0 20px var(--green);
}

.footer {
    position: absolute;
    z-index: 3;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 11px;
    letter-spacing: 3px;
    color: #4c8a70;
}

@keyframes blink {
    50% { opacity: 0; }
}

@keyframes glitch {
    0%, 90%, 100% { transform: translate(0); }
    92% { transform: translate(2px,-1px); }
    94% { transform: translate(-2px,1px); }
}

@media(max-width:600px) {
    .status { font-size: 10px; }
    .logo { width: 115px; }
    h1 { letter-spacing: 2px; }
}
</style>
</head>

<body>

<video id="bgVideo"
       class="bg-video"
       autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>
<div class="scanlines"></div>

<div class="status">
    <span class="dot"></span> SYSTEM ONLINE<br>
    ENCRYPTION: ACTIVE<br>
    ID: KAITO_A1
</div>

<main class="container">

    <img src="logo.png" class="logo" alt="Kaito">

    <h1>カイト_a1</h1>

    <div class="terminal">
        <div class="terminal-title">
            [ SYSTEM TERMINAL ]
        </div>

        <div>
            <span class="green">root@kaito</span>:~#
            Initializing system...
        </div>

        <div class="blue">
            Loading personal identity...
        </div>

        <div class="green">
            Identity verified.
        </div>

        <div>
            Access status:
            <span class="green">GRANTED</span>
        </div>

        <div>
            <span class="green">root@kaito</span>:~#
            <span class="cursor"></span>
        </div>
    </div>

    <div class="controls">
        <button id="soundBtn" onclick="toggleSound()">
            [ ENABLE VIDEO SOUND ]
        </button>
    </div>

</main>

<footer class="footer">
    KAITO_A1 • DIGITAL IDENTITY
</footer>

<script>
const video = document.getElementById("bgVideo");
const soundBtn = document.getElementById("soundBtn");

let soundEnabled = false;

async function toggleSound() {
    try {
        if (!soundEnabled) {
            video.volume = 1;
            video.muted = false;
            await video.play();

            soundEnabled = true;
            soundBtn.textContent = "[ SOUND ON ]";
        } else {
            video.muted = true;
            soundEnabled = false;
            soundBtn.textContent = "[ ENABLE VIDEO SOUND ]";
        }
    } catch (error) {
        soundBtn.textContent = "[ AUDIO ERROR ]";
        console.error(error);
    }
}
</script>

</body>
</html>
